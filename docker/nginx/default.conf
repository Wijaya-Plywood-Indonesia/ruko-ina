# ============================================================
# Nginx untuk Laravel (HTTP saja). Untuk HTTPS tambahkan blok
# listen 443 ssl seperti di proyek erp-telur.
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Laravel selalu memakai folder /public sebagai pintu masuk
    root /var/www/html/public;
    index index.php;

    # Batas upload (harus <= post_max_size di PHP)
    client_max_body_size 20M;

    # Coba file asli dulu; kalau tidak ada, serahkan ke Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Request .php diteruskan ke container "app" (PHP-FPM) port 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        # Filament/Livewire mengirim header cukup besar
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Blokir file tersembunyi (.env, .git), kecuali .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache file statis di browser
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}